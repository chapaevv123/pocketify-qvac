name: Pocketify Studio public showcase
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-showcase.mjs'
      - 'reports/sample-*.json'
      - 'examples/ticket-triage/app.mjs'
      - 'studio/seed/pocketify.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pocketify-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build evidence-backed static data
        run: node scripts/build-showcase.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
